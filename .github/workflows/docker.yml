name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/alumos/beidou-assembly-lab

concurrency:
  group: beidou-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check JavaScript and local assets
        run: python3 scripts/check-assets.py
      - name: Build test container
        run: docker build -t beidou:test .
      - name: Start and verify container
        run: |
          docker run -d --name beidou-smoke -p 127.0.0.1:18082:80 beidou:test
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18082/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18082/healthz
          curl -fsS http://127.0.0.1:18082/ | grep -q '任务一：北斗拼装台'
          curl -fsS http://127.0.0.1:18082/assets/earth-texture.jpg > /dev/null
          curl -fsS http://127.0.0.1:18082/game.js > /dev/null
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.build.yaml config --quiet
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify assembly and browser fallbacks
        env:
          BEIDOU_TEST_URL: http://127.0.0.1:18082/
        run: node scripts/browser-smoke.cjs
      - name: Container diagnostics
        if: always()
        run: |
          docker logs beidou-smoke || true
          docker rm -f beidou-smoke || true

  publish:
    name: Build and publish image
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Published image
        run: |
          echo 'Image: `ghcr.io/alumos/beidou-assembly-lab:latest`' >> "$GITHUB_STEP_SUMMARY"
          echo 'VPS: `docker compose pull && docker compose up -d` (port 18082)' >> "$GITHUB_STEP_SUMMARY"
